import discord
from discord.ext import commands
import aiosqlite
import time

from key_system import ensure_key_tables, register_key_commands

TOKEN = "your_bot_token_here"
GUILD_ID = 1234567890
DB_NAME = "database.db"
PREMIUM_ROLE_ID = 1234567890
ADMIN_ROLE_NAME = "Admin"

intents = discord.Intents.default()
intents.members = True
intents.guilds = True
intents.message_content = True

bot = commands.Bot(command_prefix="!", intents=intents)
tree = bot.tree


async def setup_db():
    async with aiosqlite.connect(DB_NAME) as db:
        await db.execute("""
            CREATE TABLE IF NOT EXISTS users (
                user_id INTEGER PRIMARY KEY,
                expires_at INTEGER
            )
        """)
        await db.commit()


def is_admin(member: discord.Member):
    return any(role.name == ADMIN_ROLE_NAME for role in member.roles)


def make_embed(title, description, color, command_name=None):
    embed = discord.Embed(title=title, description=description, color=color)
    embed.set_footer(text="Fury Key System")
    return embed


def parse_duration(duration):
    duration = duration.strip().lower()
    values = {
        "1day": 86400,
        "3days": 259200,
        "7days": 604800,
        "3weeks": 1814400,
        "1month": 2592000,
        "1year": 31536000,
    }
    return values.get(duration)


@bot.event
async def on_ready():
    await setup_db()
    await ensure_key_tables(DB_NAME)

    guild = discord.Object(id=GUILD_ID)
    tree.copy_global_to(guild=guild)
    await tree.sync(guild=guild)
    print(f"Logged in as {bot.user}")


register_key_commands(
    bot,
    tree,
    DB_NAME,
    is_admin,
    make_embed,
    parse_duration,
    PREMIUM_ROLE_ID,
)


@tree.command(name="time")
async def check_time(interaction: discord.Interaction, user: discord.Member):
    async with aiosqlite.connect(DB_NAME) as db:
        async with db.execute(
            "SELECT expires_at FROM users WHERE user_id = ?",
            (user.id,)
        ) as cursor:
            row = await cursor.fetchone()

    if not row:
        return await interaction.response.send_message(f"{user.mention} has no active subscription.")

    remaining = row[0] - int(time.time())
    if remaining <= 0:
        return await interaction.response.send_message(f"{user.mention}'s subscription has expired.")

    days = remaining // 86400
    hours = (remaining % 86400) // 3600
    minutes = (remaining % 3600) // 60
    seconds = remaining % 60

    await interaction.response.send_message(
        embed=make_embed(
            "Premium Time Remaining",
            f"{user.mention}: `{days}d {hours}h {minutes}m {seconds}s`",
            0x00ff99,
        )
    )


bot.run(TOKEN)
